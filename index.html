<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F0E1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1F2427" media="(prefers-color-scheme: dark)" />
    <title>Mind the Gap</title>
    <script>
      // motyw przed pierwszym malowaniem, żeby w nocy nie mignęła jasna kartka
      try {
        var t = localStorage.getItem('mtg-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        if (localStorage.getItem('mtg-calm') === '1') document.documentElement.dataset.motion = 'calm'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
