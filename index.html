<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F0E1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1F2427" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Zeszyt do angielskiego przed maturą." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mind the Gap" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Mind the Gap</title>
    <script>
      // motyw przed pierwszym malowaniem, żeby w nocy nie mignęła jasna kartka
      try {
        var t = localStorage.getItem('mtg-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        if (localStorage.getItem('mtg-calm') === '1') document.documentElement.dataset.motion = 'calm'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
